name: Build and deploy to Azure

# Builds both Docker images and pushes them to Azure Container Registry, applies pending EF
# Core migrations to the target database, then updates the two Azure Web Apps for Containers
# to the new image. Requires these repo secrets/variables to be configured before this workflow
# can run (see docs/roadmap.md Phase 18 notes):
#   secrets.AZURE_CREDENTIALS      - output of `az ad sp create-for-rbac --sdk-auth`
#   secrets.ACR_LOGIN_SERVER       - e.g. myregistry.azurecr.io
#   secrets.ACR_USERNAME
#   secrets.ACR_PASSWORD
#   secrets.AZURE_SQL_CONNECTION_STRING - target database's connection string, used only to run
#                                         `dotnet ef database update` — never logged, never baked
#                                         into an image.
#   vars.AZURE_API_APP_NAME        - name of the Web App for Containers running the API
#   vars.AZURE_CLIENT_APP_NAME     - name of the Web App for Containers running the frontend
#   vars.API_BASE_URL              - public URL of the API, baked into the frontend build
#
# Migrations run before the new image is deployed (deploy needs migrate), so the schema is
# always ready before traffic can reach code that expects it. If AZURE_SQL_CONNECTION_STRING
# isn't set, the migrate job is skipped — deploy still runs, but you must apply migrations
# manually (`dotnet ef database update`) before or immediately after swapping traffic.
#
# A `test` job (dotnet build/test, npm ci/lint/build) and a `test-mobile` job (Flutter
# pub get/format/analyze/test) both gate every other job — a failing build or test suite in
# either the backend/web or the Flutter app blocks the deploy entirely, it never reaches
# build-and-push. test-mobile is a separate job (not folded into `test`) since Flutter is an
# independent toolchain from .NET/Node and this keeps the two failure domains distinguishable
# in the Actions UI.

on:
  push:
    branches: [main]
  # The test jobs must also run on pull requests, otherwise there is no check to require before
  # merging and branch protection has nothing to gate on. The deploy-side jobs below are guarded
  # with github.event_name == 'push' so a PR runs the tests and stops there -- it never builds an
  # image, touches the database, or deploys.
  pull_request:
    branches: [main]
  workflow_dispatch: {}

env:
  IMAGE_TAG: ${{ github.sha }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: dotnet build
        run: dotnet build --configuration Release

      - name: dotnet test
        run: dotnet test --configuration Release --no-build

      # Detects the presence of a finding rather than the absence of a reassuring string:
      # the command prints one line per project, so checking for "has no vulnerable
      # packages" would be satisfied by any single clean project while another reported
      # advisories. It also exits 0 either way, so its output is the only usable signal.
      - name: Check for vulnerable NuGet packages
        shell: bash
        run: |
          report=$(dotnet list package --vulnerable --include-transitive 2>&1)
          echo "$report"
          if echo "$report" | grep -q "has the following vulnerable packages"; then
            echo "::error::Vulnerable NuGet packages found (see the table above)."
            exit 1
          fi
          echo "No vulnerable packages found."

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: client/real-estate-crm-react/package-lock.json

      - name: npm ci (frontend)
        working-directory: client/real-estate-crm-react
        run: npm ci

      - name: npm run lint (frontend)
        working-directory: client/real-estate-crm-react
        run: npm run lint

      - name: npm test (frontend)
        working-directory: client/real-estate-crm-react
        run: npm test

      # High/Critical only: a moderate advisory in build-only tooling should not block
      # every PR while nobody is triaging lower severities.
      - name: npm audit (frontend)
        working-directory: client/real-estate-crm-react
        run: npm audit --audit-level=high

      # The design system under client/real-estate-crm-react/design-system/ is a vendored copy.
      # Its source of truth is the MeCodex repo, where the theme files are generated and their
      # contrast is solved for rather than checked afterwards. A hand-edit here looks entirely
      # reasonable in review and silently drops this app out of those guarantees, so nothing would
      # fail -- the colours would just quietly stop being AA-compliant.
      #
      # MeCodex is public, so this can clone it and diff. Pinned to a tag-less shallow clone of
      # main on purpose: the intent is "does our copy match what MeCodex ships today", and pinning
      # to a commit would just move the staleness somewhere harder to notice.
      #
      # If this fails, one of two things happened: the copy here was edited (re-vendor it), or
      # MeCodex regenerated its themes (re-vendor it, then check nothing visual regressed).
      - name: Check the vendored design system matches MeCodex
        run: |
          git clone --depth 1 https://github.com/Mostafaessam7/MeCodex.git "$RUNNER_TEMP/mecodex"

          vendored="client/real-estate-crm-react/design-system"
          source="$RUNNER_TEMP/mecodex/design-system"

          # Only the files actually vendored here are compared. MeCodex also ships an Angular
          # adapter and the generator scripts, which this app has no reason to carry.
          #
          # --strip-trailing-cr is load-bearing, not defensive: MeCodex commits these files with
          # CRLF and the copy here is committed with LF. The content is byte-identical otherwise
          # (5215 vs 5078 bytes on tokens.css -- exactly the 137 CR characters). Without this flag
          # the check fails on every single run and gets muted, which is worse than not having it.
          failed=0
          for f in tokens.css tailwind-preset.js themes/navy-corporate.css; do
            if ! diff --strip-trailing-cr -q "$source/$f" "$vendored/$f" > /dev/null 2>&1; then
              echo "::error file=$vendored/$f::Drifted from MeCodex/design-system/$f"
              diff --strip-trailing-cr "$source/$f" "$vendored/$f" || true
              failed=1
            fi
          done

          if [ "$failed" -ne 0 ]; then
            echo "The vendored design system no longer matches its source. Re-vendor the files above."
            exit 1
          fi

          echo "Vendored design system matches MeCodex."

      - name: npm run build (frontend)
        working-directory: client/real-estate-crm-react
        run: npm run build

  test-mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"

      - name: flutter pub get
        working-directory: mobile
        run: flutter pub get

      - name: dart format --set-exit-if-changed
        working-directory: mobile
        run: dart format --output=none --set-exit-if-changed .

      - name: flutter analyze
        working-directory: mobile
        run: flutter analyze

      - name: flutter test
        working-directory: mobile
        run: flutter test

  # Reads the secrets context in a step, which is allowed, and exposes the answer as an output,
  # which a job-level `if` can use. This exists purely because `secrets` cannot be referenced
  # from `jobs.<id>.if`.
  config:
    runs-on: ubuntu-latest
    outputs:
      has-sql-connection: ${{ steps.check.outputs.has-sql-connection }}
    steps:
      - id: check
        env:
          SQL_CONNECTION: ${{ secrets.AZURE_SQL_CONNECTION_STRING }}
        run: |
          if [ -n "$SQL_CONNECTION" ]; then
            echo "has-sql-connection=true" >> "$GITHUB_OUTPUT"
          else
            echo "has-sql-connection=false" >> "$GITHUB_OUTPUT"
          fi

  build-and-push:
    needs: [test, test-mobile]
    # Push-only: a pull request runs the two test jobs and stops there. It must never build or
    # publish an image, and a fork PR would not have registry credentials anyway.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/RealEstateCRM.Api/Dockerfile
          push: true
          tags: |
            ${{ secrets.ACR_LOGIN_SERVER }}/realestatecrm-api:${{ env.IMAGE_TAG }}
            ${{ secrets.ACR_LOGIN_SERVER }}/realestatecrm-api:latest

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: client/real-estate-crm-react
          push: true
          build-args: |
            VITE_API_BASE_URL=${{ vars.API_BASE_URL }}
          tags: |
            ${{ secrets.ACR_LOGIN_SERVER }}/realestatecrm-client:${{ env.IMAGE_TAG }}
            ${{ secrets.ACR_LOGIN_SERVER }}/realestatecrm-client:latest

  migrate:
    needs: [build-and-push, config]
    runs-on: ubuntu-latest
    # Only runs when the connection string secret is configured — see the header comment.
    #
    # The check goes through config.outputs rather than reading `secrets` here: the secrets context
    # is not available in a job-level `if`, and using it made the whole workflow unparseable. Every
    # run failed before a single job started, which is why this file produced no checks at all.
    if: ${{ github.event_name == 'push' && needs.config.outputs.has-sql-connection == 'true' }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Install dotnet-ef
        run: dotnet tool install --global dotnet-ef

      - name: Apply pending migrations
        env:
          ConnectionStrings__DefaultConnection: ${{ secrets.AZURE_SQL_CONNECTION_STRING }}
        run: >
          dotnet ef database update
          --project src/RealEstateCRM.Infrastructure
          --startup-project src/RealEstateCRM.Api

  deploy:
    needs: [build-and-push, migrate]
    runs-on: ubuntu-latest
    # `needs: migrate` normally waits for it, but migrate is conditionally skipped when the
    # connection string secret isn't set — without this, "skipped" would block deploy entirely.
    if: ${{ github.event_name == 'push' && !cancelled() && needs.build-and-push.result == 'success' && (needs.migrate.result == 'success' || needs.migrate.result == 'skipped') }}
    steps:
      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy API image
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_API_APP_NAME }}
          images: ${{ secrets.ACR_LOGIN_SERVER }}/realestatecrm-api:${{ env.IMAGE_TAG }}

      - name: Deploy frontend image
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_CLIENT_APP_NAME }}
          images: ${{ secrets.ACR_LOGIN_SERVER }}/realestatecrm-client:${{ env.IMAGE_TAG }}
